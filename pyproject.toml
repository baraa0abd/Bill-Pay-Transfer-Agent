[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iraqi-wallet-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "pydantic>=2,<3", "httpx>=0.27,<1", "rapidfuzz>=3,<4", "python-multipart>=0.0.18"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4"]

[tool.setuptools.packages.find]
include = ["agent*", "wallet_api*", "voice*", "data*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

addopts = "--basetemp=.test-tmp"
